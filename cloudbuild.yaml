steps:
# 1. Build the Container Image
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '-t', 'us-central1-docker.pkg.dev/$PROJECT_ID/billing-repo/billing-backend:$COMMIT_SHA', '-f', 'Dockerfile', '.']

# 2. Push the Image to Artifact Registry
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'us-central1-docker.pkg.dev/$PROJECT_ID/billing-repo/billing-backend:$COMMIT_SHA']

# 3. Deploy to Cloud Run
- name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
  entrypoint: gcloud
  args:
  - 'run'
  - 'deploy'
  - 'billing-backend'
  - '--image'
  - 'us-central1-docker.pkg.dev/$PROJECT_ID/billing-repo/billing-backend:$COMMIT_SHA'
  - '--region'
  - 'us-central1'
  - '--allow-unauthenticated'
  - '--set-env-vars'
  - 'ASPNETCORE_ENVIRONMENT=Production'

# --- THE FIX IS HERE ---
options:
  logging: CLOUD_LOGGING_ONLY

images:
- 'us-central1-docker.pkg.dev/$PROJECT_ID/billing-repo/billing-backend:$COMMIT_SHA'
